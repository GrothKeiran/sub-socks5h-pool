name: Docker 镜像构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 原生构建及测试 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 计算镜像名称
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 构建待测镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: sub-socks5h-pool:test
          provenance: false
          cache-from: type=gha,scope=pool-${{ matrix.arch }}

      - name: 在真实镜像内执行离线测试（含 Mihomo 集成测试）
        shell: bash
        run: |
          mkdir -p ".cache/docker-${{ matrix.arch }}/tmp" ".cache/docker-data-${{ matrix.arch }}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$PWD/.cache/docker-${{ matrix.arch }},dst=/app/.cache" \
            --mount "type=bind,src=$PWD/.cache/docker-data-${{ matrix.arch }},dst=/app/data" \
            -e PYTHONPYCACHEPREFIX=/app/.cache/pycache \
            -e TMPDIR=/app/.cache/tmp \
            -e XDG_CACHE_HOME=/app/.cache \
            --entrypoint python3 sub-socks5h-pool:test \
            -W error::ResourceWarning -m unittest discover -s /app/tests -v

      - name: 登录 GHCR（仅使用工作流临时令牌）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送通过测试的架构镜像
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=sub-socks5h-pool
            org.opencontainers.image.description=订阅驱动的 SOCKS5h 尽力轮换代理池
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=pool-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pool-${{ matrix.arch }}

  publish:
    name: 发布多架构镜像清单
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登录 GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 amd64 与 arm64 并发布标签
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          args=(--tag "$image:sha-${GITHUB_SHA::12}")
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$image:latest")
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$image:${GITHUB_REF_NAME#v}")
          fi
          docker buildx imagetools create "${args[@]}" \
            "$image:build-$GITHUB_SHA-amd64" "$image:build-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::12}"
          {
            echo '## 多架构 Docker 镜像已发布'
            echo
            echo "- 镜像：\`$image:sha-${GITHUB_SHA::12}\`"
            echo '- 支持：`linux/amd64`、`linux/arm64`'
            echo '- 两个架构均在原生 runner 内构建，并通过容器内离线及真实内核集成测试。'
            echo '- 首次发布的 GHCR 包可能默认为 Private，需要在包设置中改为 Public 才能匿名拉取。'
          } >> "$GITHUB_STEP_SUMMARY"
